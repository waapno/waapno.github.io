<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download - MapShop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #06090a 0%, #0f1419 100%);
      color: #e0e6ed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .download-container {
      max-width: 500px;
      width: 100%;
      background: rgba(17, 22, 25, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 127, 0.15);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    
    .logo { font-size: 48px; margin-bottom: 10px; }
    .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #00ff7f; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
    
    .status-icon {
      font-size: 64px;
      margin: 20px 0;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-text { font-size: 16px; margin-bottom: 10px; }
    .status-info { font-size: 13px; color: #888; margin-bottom: 30px; }
    
    .button-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #00ff7f;
      color: #000;
    }
    
    .btn-primary:hover {
      background: #00e5ff;
    }
    
    .btn-secondary {
      background: rgba(0, 255, 127, 0.1);
      color: #00ff7f;
      border: 1px solid rgba(0, 255, 127, 0.3);
    }
    
    .btn-secondary:hover {
      background: rgba(0, 255, 127, 0.2);
    }
    
    .error-box {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      color: #ff6b6b;
      font-size: 13px;
    }
    
    .success-box {
      background: rgba(0, 255, 127, 0.1);
      border: 1px solid rgba(0, 255, 127, 0.3);
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      color: #00ff7f;
      font-size: 13px;
    }
    
    .product-info {
      background: rgba(0, 255, 127, 0.05);
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
      font-size: 13px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
    }
    
    .info-label { color: #00e5ff; }
    .info-value { font-weight: bold; }
    
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(0, 255, 127, 0.1);
      border-radius: 2px;
      margin: 15px 0;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: #00ff7f;
      animation: progress 0.6s ease-out;
    }
    
    @keyframes progress {
      from { width: 0; }
      to { width: 100%; }
    }
    
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 255, 127, 0.1);
      font-size: 12px;
      color: #888;
    }
    
    .footer a {
      color: #00e5ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="download-container">
  <div class="logo">🗺</div>
  <div class="title">MapShop</div>
  <div class="subtitle">Product Download</div>
  
  <div id="content">
    <div class="status-icon" id="status-icon">⏳</div>
    <div class="status-text" id="status-text">Verifying access...</div>
    <div class="status-info" id="status-info">Please wait...</div>
  </div>
  
  <div class="footer">
    <p><a href="index.html">Back to Shop</a></p>
  </div>
</div>

<script>
  // Načti download manager
  const scriptPath = new URL('../assets/js/download-manager.js', window.location).href;
  const script = document.createElement('script');
  script.src = scriptPath;
  script.onload = initDownload;
  document.head.appendChild(script);

  async function initDownload() {
    // Extrahuj token z URL
    const token = window.location.pathname.split('/').pop();
    
    if (!token || !token.startsWith('dl_')) {
      showError('Invalid Link', 'The download link is invalid or expired.');
      return;
    }

    // Dej serveru čas na inicializaci
    await new Promise(resolve => setTimeout(resolve, 500));

    // Ověř token
    const result = window.MapShopDownloadMgr.validateAndUseToken(token);

    if (!result) {
      showError('Access Denied', 'The link is invalid, expired, or you have exceeded the download limit. Contact us on Discord.');
      return;
    }

    showSuccess(result);
  }

  function showError(title, message) {
    document.getElementById('status-icon').innerHTML = '❌';
    document.getElementById('status-icon').style.animation = 'none';
    document.getElementById('status-text').textContent = title;
    document.getElementById('status-info').innerHTML = message + 
      '<div class="error-box" style="margin-top: 15px;">' +
        'If the problem persists, contact us via Discord.' +
      '</div>' +
      '<div class="button-group">' +
        '<a href="../index.html" class="btn btn-secondary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">← Back to Shop</a>' +
      '</div>';
  }

  function showSuccess(result) {
    const timeRemaining = getTimeRemaining(result.expiresAt);
    const usesRemaining = result.maxDownloads - result.accessCount;

    document.getElementById('status-icon').innerHTML = '✓';
    document.getElementById('status-icon').style.animation = 'none';
    document.getElementById('status-icon').style.color = '#00ff7f';
    document.getElementById('status-text').textContent = 'Ready to Download';
    
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="status-icon" style="animation: none; color: #00ff7f; font-size: 52px; margin-top: 0; margin-bottom: 20px;">✓</div>
      <div class="status-text">Ready to Download</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
      
      <div class="product-info">
        <div class="info-row">
          <span class="info-label">Product:</span>
          <span class="info-value">${escapeHtml(result.productTitle)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Downloads Remaining:</span>
          <span class="info-value">${usesRemaining}/${result.maxDownloads}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Expires:</span>
          <span class="info-value">${timeRemaining}</span>
        </div>
      </div>
      
      <div class="button-group" style="margin-top: 20px;">
        <button class="btn btn-primary" id="btn-download">📥 Download Now</button>
        <a href="../index.html" class="btn btn-secondary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">← Back</a>
      </button>
      </div>
      
      <div class="success-box" style="margin-top: 15px;">
        Your download is secure and limited to ${result.maxDownloads} attempts.
      </div>
    `;

    // Event listener pro download
    document.getElementById('btn-download').addEventListener('click', () => {
      // Přesměruj na skutečný soubor
      window.location.href = result.downloadUrl;
      
      // Nebo, pokud je to GitHub release:
      // window.open(result.downloadUrl, '_blank');
    });
  }

  function getTimeRemaining(expiresAt) {
    const now = new Date();
    const expires = new Date(expiresAt);
    const diff = expires - now;

    if (diff < 0) return 'Expired';
    
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    
    if (days > 0) return `${days}d ${hours}h`;
    if (hours > 0) return `${hours} hours`;
    
    const minutes = Math.floor(diff / (1000 * 60));
    return `${minutes} minutes`;
  }

  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }
</script>

</body>
</html>
